<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic Sort — пример встраивания</title>
  <style>
    :root {
      --bg: #0f1430;
      --panel: #1b2148;
      --panel-2: #242b58;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f1f3ff;
      --dim: #aab1d8;
      --accent: #7c5cff;
      --good: #4ad991;
      --bad: #ff6373;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
        Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #0e1330, #1a2050);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      grid-template-rows: 1fr;
      gap: 14px;
      padding: 14px;
    }
    .game-wrap {
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      min-height: 540px;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .side {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .panel h3 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--dim);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    button, input {
      font: inherit;
      color: var(--text);
    }
    button {
      background: var(--panel-2);
      border: 1px solid var(--line);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: #2c3470; }
    button.primary {
      background: linear-gradient(180deg, #8a6cff, #6a48ff);
      border-color: transparent;
    }
    input[type="number"] {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      width: 80px;
    }
    .log {
      flex: 1;
      overflow: auto;
      background: #0c102a;
      border-radius: 10px;
      padding: 10px;
      font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
      font-size: 12px;
      color: var(--dim);
      min-height: 200px;
      max-height: 100%;
    }
    .log .ts { color: #7e85b3; }
    .log .ev { color: #b0a3ff; }
    .log .ev.good { color: var(--good); }
    .log .ev.bad { color: var(--bad); }
    .log pre {
      margin: 2px 0 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      text-align: center;
    }
    .stats > div {
      background: var(--panel-2);
      border-radius: 10px;
      padding: 8px;
    }
    .stats .lbl {
      font-size: 11px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stats .val {
      font-size: 18px;
      font-weight: 700;
      margin-top: 2px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 18px;
    }
    .sub {
      color: var(--dim);
      font-size: 12px;
      margin: 0 0 8px;
    }
    @media (max-width: 760px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(420px, 60vh) auto;
      }
      .side { max-height: none; }
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <iframe
      id="game"
      src="./index.html"
      title="Magic Sort"
      allow="autoplay; gyroscope; accelerometer; fullscreen"
    ></iframe>
  </div>

  <aside class="side">
    <div class="panel">
      <h1>Magic Sort — host demo</h1>
      <p class="sub">
        Эта страница встраивает игру через <code>&lt;iframe&gt;</code>,
        слушает <code>postMessage</code> и шлёт команды обратно. Готовый
        паттерн для интеграции в ваше приложение.
      </p>
    </div>

    <div class="panel">
      <h3>Stats</h3>
      <div class="stats">
        <div>
          <div class="lbl">Текущий уровень</div>
          <div class="val" id="stat-level">—</div>
        </div>
        <div>
          <div class="lbl">Ходы</div>
          <div class="val" id="stat-moves">—</div>
        </div>
        <div>
          <div class="lbl">Звёзды</div>
          <div class="val" id="stat-stars">—</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>Команды</h3>
      <div class="row">
        <button class="primary" data-cmd="showMenu">В меню</button>
        <input type="number" id="goto-level" min="1" max="60" value="1" />
        <button data-cmd="startLevel">Перейти</button>
        <button data-cmd="resetProgress">Сбросить прогресс</button>
      </div>
      <div class="row" style="margin-top: 8px">
        <button data-set='{"dark": true}'>Тема: тёмная</button>
        <button data-set='{"dark": false}'>Тема: светлая</button>
      </div>
    </div>

    <div class="panel" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
      <h3 style="display: flex; justify-content: space-between; align-items: center;">
        <span>События от игры</span>
        <button id="clear-log" style="padding: 4px 10px; font-size: 11px;">очистить</button>
      </h3>
      <div class="log" id="log"></div>
    </div>
  </aside>

  <script>
    (function () {
      "use strict";
      var NS = "magic-sort";
      var iframe = document.getElementById("game");
      var log = document.getElementById("log");
      var statLevel = document.getElementById("stat-level");
      var statMoves = document.getElementById("stat-moves");
      var statStars = document.getElementById("stat-stars");

      function send(type, payload) {
        try {
          iframe.contentWindow.postMessage(
            { target: NS, type: type, payload: payload || {} },
            "*",
          );
        } catch (e) {
          appendLog("error", { error: String(e) }, "bad");
        }
      }

      function appendLog(type, payload, cls) {
        var time = new Date().toLocaleTimeString();
        var entry = document.createElement("div");
        entry.innerHTML =
          '<span class="ts">' + time + '</span> ' +
          '<span class="ev ' + (cls || "") + '">' + type + '</span>';
        var pre = document.createElement("pre");
        pre.textContent = JSON.stringify(payload || {}, null, 2);
        entry.appendChild(pre);
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
      }

      window.addEventListener("message", function (e) {
        var data = e && e.data;
        if (!data || data.source !== NS) return;
        var cls = "";
        if (data.type === "levelComplete") cls = "good";
        else if (data.type === "levelFail") cls = "bad";
        appendLog(data.type, data.payload, cls);

        if (data.type === "levelStart") {
          statLevel.textContent = data.payload.id;
          statMoves.textContent = "0";
          statStars.textContent = "—";
        } else if (data.type === "move") {
          statMoves.textContent = data.payload.moves;
        } else if (data.type === "levelComplete") {
          statStars.textContent = "★".repeat(data.payload.stars || 0);
        }
      });

      document.body.addEventListener("click", function (e) {
        var t = e.target.closest("[data-cmd]");
        if (t) {
          var cmd = t.dataset.cmd;
          var payload = {};
          if (cmd === "startLevel") {
            payload = { id: Number(document.getElementById("goto-level").value) || 1 };
          }
          send(cmd, payload);
          appendLog("→ " + cmd, payload);
          return;
        }
        var s = e.target.closest("[data-set]");
        if (s) {
          var p = JSON.parse(s.dataset.set);
          send("setSettings", p);
          appendLog("→ setSettings", p);
        }
      });

      document.getElementById("clear-log").addEventListener("click", function () {
        log.innerHTML = "";
      });

      appendLog("host ready", { iframe: iframe.src });
    })();
  </script>
</body>
</html>
